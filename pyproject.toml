[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcpredictor"
version = "1.0.0"
description = "Win/draw/loss probability model for men's international football matches"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.6",
    "joblib>=1.3",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
plots = ["matplotlib>=3.7"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
notebook = ["jupyter", "matplotlib>=3.7"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
wcp = "wcpredictor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wcpredictor = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]
# explore.ipynb is kept verbatim as the research log, so it is not linted.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
